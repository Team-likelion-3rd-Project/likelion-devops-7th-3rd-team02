alertmanager:
  enabled: false
configmapReload:
  prometheus:
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
kube-state-metrics:
  collectors:
  - deployments
  - pods
  - nodes
  - horizontalpodautoscalers
  - cronjobs
  enabled: true
  fullnameOverride: onprem-kube-state-metrics
  nodeSelector:
    kubernetes.io/hostname: onprem-worker-01
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
prometheus-node-exporter:
  enabled: true
  extraArgs:
  - --collector.disable-defaults
  - --collector.cpu
  - --collector.meminfo
  - --collector.uname
  fullnameOverride: onprem-node-exporter
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 20m
      memory: 24Mi
prometheus-pushgateway:
  enabled: false
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus:
    enabled: false
  prometheus-pushgateway:
    enabled: false
server:
  fullnameOverride: onprem-prometheus
  global:
    evaluation_interval: 60s
    scrape_interval: 60s
    scrape_timeout: 10s
  ingress:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: onprem-worker-02
  persistentVolume:
    enabled: true
    existingClaim: prometheus-data
  replicaCount: 1
  resources:
    limits:
      cpu: 700m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 256Mi
  retention: 2d
  retentionSize: 2GB
  service:
    servicePort: 9090
    type: ClusterIP
  terminationGracePeriodSeconds: 60
serverFiles:
  prometheus.yml:
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - honor_labels: true
      job_name: kube-state-metrics
      static_configs:
      - targets:
        - onprem-kube-state-metrics.monitoring.svc.cluster.local:8080
    - job_name: node-exporter
      static_configs:
      - labels:
          node: onprem-cp-01
        targets:
        - 192.168.56.10:9100
      - labels:
          node: onprem-worker-01
        targets:
        - 192.168.56.11:9100
      - labels:
          node: onprem-worker-02
        targets:
        - 192.168.56.12:9100
    - job_name: backend
      kubernetes_sd_configs:
      - namespaces:
          names:
          - devflow
        role: pod
      metrics_path: /actuator/prometheus
      relabel_configs:
      - action: keep
        regex: backend
        source_labels:
        - __meta_kubernetes_pod_label_app
      - action: keep
        regex: Running
        source_labels:
        - __meta_kubernetes_pod_phase
      - action: keep
        regex: http
        source_labels:
        - __meta_kubernetes_pod_container_port_name
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
