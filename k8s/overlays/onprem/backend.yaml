apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: onprem-worker-01
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02-backend:sha-87b04f86f465ea949fda5fa5e06b77275ff570a2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: CACHE_TYPE
              value: redis
            - name: REDIS_HOST
              value: redis.devflow.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDISCLI_AUTH
            - name: TZ
              value: Asia/Seoul
            - name: K8S_NAMESPACE
              value: devflow
            - name: CORS_ALLOWED_ORIGINS
              value: http://devflow.onprem.test:30080
            - name: FRONTEND_BASE_URL
              value: http://devflow.onprem.test:30080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devflow
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
