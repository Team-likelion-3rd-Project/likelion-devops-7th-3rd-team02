---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: devflow
    spec:
      serviceAccountName: external-dns
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          imagePullPolicy: IfNotPresent
          args:
            - --provider=aws
            - --source=ingress
            - --policy=upsert-only
            - --registry=txt
            - --txt-owner-id=devflow-dev-eks
            - --domain-filter=devflowlab.net
            # apex devflowlab.net(Alias to CloudFront)은 Terraform 전용이고 Origin
            # 호스트만 등록해야 하므로 Ingress 측 annotation-only
            # (external-dns.alpha.kubernetes.io/ingress-hostname-source)로 관리한다.
            # v0.21 의 --exclude-domains 는 suffix match 라 apex 지정 시
            # *.devflowlab.net 전체가 배제되므로 사용하지 않는다.
            - --aws-zone-type=public
            - --interval=1m
            - --log-level=info
            - --log-format=text
            - --metrics-address=:7979
          env:
            - name: AWS_REGION
              value: ap-northeast-1
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-1
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
          ports:
            - name: http-metrics
              containerPort: 7979
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
