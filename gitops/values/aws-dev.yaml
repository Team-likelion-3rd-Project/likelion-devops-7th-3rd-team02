global:
  namespace: devflow
  imagePullSecretName: ""

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/frontend
    tag: "<IMAGE_TAG>"

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/backend
    tag: "<IMAGE_TAG>"
  config:
    dbUrl: "jdbc:postgresql://<RDS_HOST>:5432/deflow_db"
    springProfile: "prod"
    serverPort: "8080"
    jwtExpiration: "3600000"
    # 비밀값(DB 계정, JWT_SECRET, OAuth Client Secret, 토큰류)은 backend-secret 에 직접 넣는다
    env:
      TZ: "Asia/Seoul"
      K8S_NAMESPACE: "devflow"
      FRONTEND_BASE_URL: "https://devflowlab.net"
      CORS_ALLOWED_ORIGINS: "https://devflowlab.net"
      CACHE_TYPE: "memory"
      # 클러스터 내부·Tailscale Egress Service(ClusterIP 사설 주소)의 Prometheus를 등록하려면 true.
      # 루프백·링크 로컬·메타데이터(169.254.169.254) 주소는 이 값과 상관없이 항상 차단된다.
      DEVFLOW_CLOUD_ALLOW_PRIVATE_NETWORK: "true"
      GITHUB_OAUTH_CLIENT_ID: "Ov23li29AtY1YkSadIUk"
      GOOGLE_OAUTH_CLIENT_ID: "1056613756274-r3m0a6bljqr5sk2hkkpd2281qusglitn.apps.googleusercontent.com"
      ATTACHMENT_STORAGE: "s3"
      # 실제 버킷 이름은 ArgoCD 배포 시 주입("<ATTACHMENT_BUCKET>" placeholder 유지, HEAD의 backend.attachment.bucket 동일 값)
      ATTACHMENT_S3_BUCKET: "<ATTACHMENT_BUCKET>"
      ATTACHMENT_S3_REGION: "ap-northeast-1"
      ATTACHMENT_MAX_FILE_SIZE_MB: "10"
  serviceAccount:
    roleArn: "<BACKEND_IRSA_ROLE_ARN>"
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

ingress:
  className: alb
  host: devflowlab.net
  albOriginHost: origin.devflowlab.net
