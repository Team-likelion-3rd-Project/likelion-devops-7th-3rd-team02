global:
  namespace: devflow
  imagePullSecretName: ""

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/frontend
    tag: "<IMAGE_TAG>"

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/backend
    tag: "<IMAGE_TAG>"
  config:
    dbUrl: "jdbc:postgresql://<RDS_HOST>:5432/deflow_db"
    springProfile: "prod"
    serverPort: "8080"
    jwtExpiration: "3600000"
    env:
      TZ: "Asia/Seoul"
      K8S_NAMESPACE: "devflow"
      FRONTEND_BASE_URL: "https://team02-app.manoit.co.kr"
      CORS_ALLOWED_ORIGINS: "https://team02-app.manoit.co.kr"
      CACHE_TYPE: "memory"
      DEVFLOW_CLOUD_ALLOW_PRIVATE_NETWORK: "false"
      GITHUB_OAUTH_CLIENT_ID: "Ov23li29AtY1YkSadIUk"
      GOOGLE_OAUTH_CLIENT_ID: "1056613756274-r3m0a6bljqr5sk2hkkpd2281qusglitn.apps.googleusercontent.com"
      ATTACHMENT_S3_REGION: "ap-northeast-1"
  irsa:
    roleArn: "<BACKEND_IRSA_ROLE_ARN>"
  attachment:
    bucket: "<ATTACHMENT_BUCKET>"
    storage: "s3"
    maxFileSizeMb: "10"
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

ingress:
  className: alb
  host: team02-app.manoit.co.kr
  albOriginHost: team02-app-alb.manoit.co.kr
