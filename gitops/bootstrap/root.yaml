apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devflow-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team02-gitops.git
    path: applications
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
