# docker compose 전용 Frontend Nginx 설정
# frontend/nginx.conf(Kubernetes용, /api는 Ingress가 처리)와 달리
# compose에서는 Nginx가 /api, /actuator 요청을 backend 컨테이너로 넘긴다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 소셜 로그인 시작(/oauth2/authorization/*)과 제공자 콜백(/login/oauth2/code/*)은 Backend가 처리
    # 원래 주소(localhost:3000)를 그대로 넘겨야 콜백 주소 검증이 맞는다 ($http_host는 포트 포함)
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
