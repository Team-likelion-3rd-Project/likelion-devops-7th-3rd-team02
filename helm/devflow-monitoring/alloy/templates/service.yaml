apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: devflow-monitoring
spec:
  type: ClusterIP
  selector:
    app: alloy
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
