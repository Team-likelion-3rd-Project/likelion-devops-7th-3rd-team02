global:
  resolve_timeout: 5m

route:
  receiver: devflow
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: devflow
    slack_configs:
      - api_url_file: /etc/alertmanager/slack/webhook-url
        channel: '#devflow-alerts'
        send_resolved: true
    webhook_configs:
      - url: http://backend.devflow.svc.cluster.local:8080/api/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/devflow/alertmanager-token
