loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: Monolithic
  test:
    enabled: false
  lokiCanary:
    enabled: false
  gateway:
    enabled: false
  rollout_operator:
    enabled: false
  memcached:
    enabled: false
  memcachedExporter:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  distributor:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  indexGateway:
    replicas: 0
  compactor:
    replicas: 0
  singleBinary:
    enabled: true
    kind: StatefulSet
    replicas: 1
    sidecar: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      size: 20Gi
      accessModes:
        - ReadWriteOnce
      storageClass: "ebs-sc"
      enableStatefulSetAutoDeletePVC: false
  loki:
    structuredConfig:
      auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_global_streams_per_user: 10000
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    rulerConfig:
      enable_api: false
