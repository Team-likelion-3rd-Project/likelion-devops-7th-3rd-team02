apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/managed-by: kubectl
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.config.springProfile | quote }}
  SERVER_PORT: {{ .Values.backend.config.serverPort | quote }}
  DB_URL: {{ .Values.backend.config.dbUrl | quote }}
  JWT_EXPIRATION: {{ .Values.backend.config.jwtExpiration | quote }}
  {{- with .Values.backend.irsa.roleArn }}
  DEVFLOW_AWS_PRINCIPAL_ARN: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.backend.config.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- with .Values.backend.attachment.bucket }}
  ATTACHMENT_S3_BUCKET: {{ . | quote }}
  ATTACHMENT_STORAGE: {{ $.Values.backend.attachment.storage | default "s3" | quote }}
  ATTACHMENT_MAX_FILE_SIZE_MB: {{ $.Values.backend.attachment.maxFileSizeMb | default "10" | quote }}
  {{- end }}
