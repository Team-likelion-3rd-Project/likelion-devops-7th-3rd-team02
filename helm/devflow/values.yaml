global:
  namespace: devflow
  imagePullSecretName: ""

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/frontend
    tag: "<IMAGE_TAG>"

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team02/backend
    tag: "<IMAGE_TAG>"
  config:
    dbUrl: "jdbc:postgresql://<RDS_HOST>:5432/deflow_db"
    springProfile: "dev"
    serverPort: "8080"
    jwtExpiration: "3600000"
    # 그 밖의 Backend 환경변수 (비밀값은 backend-secret 에 둔다)
    env: {}
  serviceAccount:
    # IRSA: 첨부파일 S3 접근용 IAM Role ARN (비우면 annotation 없음)
    roleArn: ""
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

ingress:
  className: alb
  host: team02-app.manoit.co.kr
  albOriginHost: ""
