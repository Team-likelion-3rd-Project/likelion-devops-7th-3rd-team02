# DevFlow 전체 실행 (PostgreSQL + Backend + Frontend)
#
#   1) cp .env.example .env   # 값 채우기
#   2) docker compose up -d --build
#   3) http://localhost:3000  (Swagger: http://localhost:8080/swagger-ui.html)
#
# DB만 필요하면 backend/docker-compose.yml 을 사용합니다.

services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devflow}
      POSTGRES_USER: ${DB_USERNAME:-devflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요 (.env.example 참고)}
      TZ: Asia/Seoul
    volumes:
      - devflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: devflow-backend:local
    container_name: devflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # local 프로필: 스키마는 Flyway(V1~)가 만들고 Hibernate는 검증만 한다
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-devflow}
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요 (32자 이상)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Webhook 공유 토큰 (비어 있으면 해당 Webhook 비활성). 배포 기록 D3, Alertmanager I5
      DEPLOY_WEBHOOK_TOKEN: ${DEPLOY_WEBHOOK_TOKEN:-}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      INCIDENT_AUTO_RESOLVE_AFTER: ${INCIDENT_AUTO_RESOLVE_AFTER:-30m}
      # 운영 상태는 프로젝트 설정 화면에서 환경별로 연결 (Wiki 14장). 파이프라인용 GitHub 토큰은 선택
      DEVFLOW_ENCRYPTION_KEY: ${DEVFLOW_ENCRYPTION_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_TYPE: ${CACHE_TYPE:-memory}
      # 소셜 로그인 (선택). 콜백 주소 http://localhost:3000/login/oauth2/code/{github|google}
      FRONTEND_BASE_URL: http://localhost:3000
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    # 정상 종료(server.shutdown: graceful, 20초)를 기다리도록 여유를 둠
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    image: devflow-frontend:local
    container_name: devflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"

volumes:
  devflow-postgres-data:
