spring:
  application:
    name: devflow-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 종료 신호(SIGTERM)를 받으면 새 요청을 받지 않고, 처리 중인 요청을 최대 20초까지 마친 뒤 종료
  # (Kubernetes terminationGracePeriodSeconds 기본 30초보다 짧게)
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 모든 프로필에서 검증(validate)만 한다.
  # 기존 DB(2차 dev 등, flyway_schema_history 없음)는 V1을 기준선으로 등록하고 V2부터 적용한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # Redis는 devflow.cache.type=redis일 때만 사용. 느리거나 끊기면 캐시 없이 조회하도록 짧은 타임아웃
  # 업무 첨부파일 업로드 크기 (A2). 넘으면 413 ATTACHMENT_TOO_LARGE
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:11MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 크기 제한을 넘은 업로드도 연결을 끊지 않고 413 JSON으로 응답하도록
    max-swallow-size: 20MB
  shutdown: graceful
  # Nginx·Ingress 뒤에서 원래 주소(https, 도메인)를 알 수 있도록 X-Forwarded-* 반영 (소셜 로그인 콜백 주소 확인에 필요)
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

# JWT_SECRET은 기본값이 없다. dev·prod에서 값이 없으면 앱이 시작되지 않는다.
# 로컬 개발용 기본값은 application-local.yml에만 둔다.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # 인증 없이 호출되는 경로라 DB 등 내부 구성은 노출하지 않음 (Probe는 status만 사용)
      show-details: when-authorized

  health:
    # Redis는 캐시 전용이라 내려가도 서비스 상태(health)에 영향을 주지 않는다
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    # p95 응답 시간 알림(HighLatency, histogram_quantile)용 버킷. 범위를 좁혀 시계열 수를 제한
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

devflow:
  cors:
    # 쉼표로 구분. 같은 도메인의 /api 프록시로 호출하면 필요 없음
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # 외부 시스템이 호출하는 Webhook 공유 토큰 (Authorization: Bearer ...)
  # 값이 비어 있으면 해당 Webhook은 모두 401로 거절한다. 실제 값은 Kubernetes Secret·CI 변수로만 넣는다.
  webhook:
    deploy-token: ${DEPLOY_WEBHOOK_TOKEN:}
    alertmanager-token: ${ALERTMANAGER_WEBHOOK_TOKEN:}

  # 장애 자동 해결: 확인된 장애가 알림이 풀린 뒤 이 시간 동안 다시 울리지 않으면 RESOLVED
  incident:
    auto-resolve-after: ${INCIDENT_AUTO_RESOLVE_AFTER:30m}
    auto-resolve-interval-ms: 60000

  # 외부 조회 캐시: memory(기본, Pod별) | redis (ON1 온프레미스 Redis, spring.data.redis 설정 사용)
  cache:
    type: ${CACHE_TYPE:memory}

  # GitHub: 저장소 연결 확인(G1)·Actions 파이프라인(C1). 토큰은 Secret으로만 (없으면 공개 저장소만)
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    workflow: ${GITHUB_WORKFLOW:}

  # 프로젝트별 클라우드 연결 (Wiki 14장). 환경·Prometheus 주소·AWS 역할은 프로젝트 OWNER가 화면(CL1~CL5)에서 등록한다.
  cloud:
    # 사설망(10.x, 192.168.x 등) Prometheus 허용 여부. 루프백·링크 로컬·메타데이터 주소는 항상 차단
    allow-private-network: ${DEVFLOW_CLOUD_ALLOW_PRIVATE_NETWORK:true}
    # 사용자 역할 신뢰 정책에 넣을 DevFlow Backend 주체 ARN (화면 안내용). 비우면 AWS 연결 안내에 표시되지 않음
    aws-principal-arn: ${DEVFLOW_AWS_PRINCIPAL_ARN:}
    # Prometheus 토큰 암호화 키(base64 32바이트, openssl rand -base64 32). 비우면 JWT Secret에서 파생 — 바꾸면 저장된 토큰을 다시 입력해야 함
    encryption-key: ${DEVFLOW_ENCRYPTION_KEY:}

  # 업무 첨부파일 (Backend-API-구현-목록 15장)
  # storage: local(기본, compose·온프렘 — 다운로드는 Backend 서명 주소) | s3(AWS — presigned URL, IRSA 권한)
  attachment:
    storage: ${ATTACHMENT_STORAGE:local}
    max-per-task: ${ATTACHMENT_MAX_PER_TASK:20}
    download-url-ttl: ${ATTACHMENT_DOWNLOAD_URL_TTL:5m}
    local:
      # 온프렘에서 Pod 재시작 후에도 남기려면 이 경로에 PVC 마운트
      dir: ${ATTACHMENT_LOCAL_DIR:}
    s3:
      bucket: ${ATTACHMENT_S3_BUCKET:}
      region: ${ATTACHMENT_S3_REGION:}

  # 소셜 로그인 (X1~X3). client-id·secret이 비어 있는 제공자는 비활성(버튼을 누르면 error=oauth_failed)
  # 콜백 주소: {FRONTEND_BASE_URL}/login/oauth2/code/{github|google} 를 각 OAuth App에 등록
  oauth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${GITHUB_OAUTH_AUTHORIZATION_URI:}
      token-uri: ${GITHUB_OAUTH_TOKEN_URI:}
      user-info-uri: ${GITHUB_OAUTH_USER_INFO_URI:}
      emails-uri: ${GITHUB_OAUTH_EMAILS_URI:}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
