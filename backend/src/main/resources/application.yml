spring:
  application:
    name: devflow-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 종료 신호(SIGTERM)를 받으면 새 요청을 받지 않고, 처리 중인 요청을 최대 20초까지 마친 뒤 종료
  # (Kubernetes terminationGracePeriodSeconds 기본 30초보다 짧게)
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 모든 프로필에서 검증(validate)만 한다.
  # 기존 DB(2차 dev 등, flyway_schema_history 없음)는 V1을 기준선으로 등록하고 V2부터 적용한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

# JWT_SECRET은 기본값이 없다. dev·prod에서 값이 없으면 앱이 시작되지 않는다.
# 로컬 개발용 기본값은 application-local.yml에만 둔다.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # 인증 없이 호출되는 경로라 DB 등 내부 구성은 노출하지 않음 (Probe는 status만 사용)
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

devflow:
  cors:
    # 쉼표로 구분. 같은 도메인의 /api 프록시로 호출하면 필요 없음
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
