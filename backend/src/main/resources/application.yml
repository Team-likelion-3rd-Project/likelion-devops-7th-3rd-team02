spring:
  application:
    name: devflow-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # 종료 신호(SIGTERM)를 받으면 새 요청을 받지 않고, 처리 중인 요청을 최대 20초까지 마친 뒤 종료
  # (Kubernetes terminationGracePeriodSeconds 기본 30초보다 짧게)
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 모든 프로필에서 검증(validate)만 한다.
  # 기존 DB(2차 dev 등, flyway_schema_history 없음)는 V1을 기준선으로 등록하고 V2부터 적용한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # Redis는 devflow.cache.type=redis일 때만 사용. 느리거나 끊기면 캐시 없이 조회하도록 짧은 타임아웃
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Nginx·Ingress 뒤에서 원래 주소(https, 도메인)를 알 수 있도록 X-Forwarded-* 반영 (소셜 로그인 콜백 주소 확인에 필요)
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

# JWT_SECRET은 기본값이 없다. dev·prod에서 값이 없으면 앱이 시작되지 않는다.
# 로컬 개발용 기본값은 application-local.yml에만 둔다.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # 인증 없이 호출되는 경로라 DB 등 내부 구성은 노출하지 않음 (Probe는 status만 사용)
      show-details: when-authorized

  health:
    # Redis는 캐시 전용이라 내려가도 서비스 상태(health)에 영향을 주지 않는다
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

devflow:
  cors:
    # 쉼표로 구분. 같은 도메인의 /api 프록시로 호출하면 필요 없음
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # 외부 시스템이 호출하는 Webhook 공유 토큰 (Authorization: Bearer ...)
  # 값이 비어 있으면 해당 Webhook은 모두 401로 거절한다. 실제 값은 Kubernetes Secret·CI 변수로만 넣는다.
  webhook:
    deploy-token: ${DEPLOY_WEBHOOK_TOKEN:}
    alertmanager-token: ${ALERTMANAGER_WEBHOOK_TOKEN:}

  # 장애 자동 해결: 확인된 장애가 알림이 풀린 뒤 이 시간 동안 다시 울리지 않으면 RESOLVED
  incident:
    auto-resolve-after: ${INCIDENT_AUTO_RESOLVE_AFTER:30m}
    auto-resolve-interval-ms: 60000

  # 외부 조회 캐시: memory(기본, Pod별) | redis (ON1 온프레미스 Redis, spring.data.redis 설정 사용)
  cache:
    type: ${CACHE_TYPE:memory}

  # GitHub: 저장소 연결 확인(G1)·Actions 파이프라인(C1). 토큰은 Secret으로만 (없으면 공개 저장소만)
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    workflow: ${GITHUB_WORKFLOW:}

  # 운영 상태(K1·K2·O1·E1~E3)는 각 환경의 Prometheus(kube-state-metrics·node-exporter 포함)로 조회한다.
  # Prometheus 주소가 비어 있는 환경은 "확인 불가(UNREACHABLE)"로 표시된다.
  ops:
    current-environment: ${DEVFLOW_ENV:dev}
    backend-job: ${PROMETHEUS_BACKEND_JOB:backend}
    backend-deployment: backend
    node-label: node
    environments:
      - name: dev
        label: 온프레미스 (kubeadm)
        prometheus-url: ${PROMETHEUS_URL_DEV:${PROMETHEUS_URL:}}
        namespace: ${K8S_NAMESPACE:devflow}
      - name: production
        label: AWS
        prometheus-url: ${PROMETHEUS_URL_PRODUCTION:}
        namespace: ${K8S_NAMESPACE:devflow}
        # E4·E5 (AWS). region이 비어 있으면 AWS 조회를 하지 않는다
        aws:
          region: ${AWS_REGION_PRODUCTION:}
          rds-instance-id: ${AWS_RDS_INSTANCE_ID:}
          load-balancer-arn: ${AWS_ALB_ARN:}
          target-group-arn: ${AWS_ALB_TARGET_GROUP_ARN:}

  # 소셜 로그인 (X1~X3). client-id·secret이 비어 있는 제공자는 비활성(버튼을 누르면 error=oauth_failed)
  # 콜백 주소: {FRONTEND_BASE_URL}/login/oauth2/code/{github|google} 를 각 OAuth App에 등록
  oauth:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${GITHUB_OAUTH_AUTHORIZATION_URI:}
      token-uri: ${GITHUB_OAUTH_TOKEN_URI:}
      user-info-uri: ${GITHUB_OAUTH_USER_INFO_URI:}
      emails-uri: ${GITHUB_OAUTH_EMAILS_URI:}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
