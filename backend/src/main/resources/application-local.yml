spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devflow}
    username: ${DB_USERNAME:devflow}
    password: ${DB_PASSWORD:devflow-local-password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # Flyway 도입(V1·V2) 후 local도 다른 환경과 같이 검증만 한다
      ddl-auto: validate

    show-sql: true

# 로컬 개발 전용 기본값. dev·prod는 Kubernetes Secret의 JWT_SECRET을 사용한다.
jwt:
  secret: ${JWT_SECRET:devflow-local-jwt-secret-key-devflow-local-jwt-secret-key}
