plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devflow'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 소셜 로그인 (GitHub, Google) — X1~X3
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.postgresql:postgresql'

    // 외부 조회 결과 캐시 (ON1: Redis 캐시. Redis가 없으면 메모리 캐시로 동작)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // AWS 리소스 상태 (E4 RDS, E5 ALB) — 읽기 전용 Describe·GetMetricData만 사용
    implementation platform('software.amazon.awssdk:bom:2.30.38')
    implementation 'software.amazon.awssdk:rds'
    implementation 'software.amazon.awssdk:elasticloadbalancingv2'
    implementation 'software.amazon.awssdk:cloudwatch'
    // 사용자 계정의 읽기 전용 역할을 AssumeRole (프로젝트별 클라우드 연결)
    implementation 'software.amazon.awssdk:sts'

    // DB 마이그레이션 (버전은 Spring Boot가 관리)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Prometheus
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations.configureEach {
    // AWS SDK는 동기 클라이언트만 사용 (비동기 Netty 클라이언트 제외)
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
}
