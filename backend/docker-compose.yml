services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow-local-password
      TZ: Asia/Seoul

    ports:
      - "5432:5432"

    volumes:
      - devflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devflow-postgres-data: