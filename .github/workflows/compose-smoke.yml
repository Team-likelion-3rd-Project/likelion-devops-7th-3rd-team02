name: Compose Smoke Test

# 루트 docker-compose.yml로 PostgreSQL + Backend + Frontend를 실제로 띄우고
# Frontend(Nginx) → /api → Backend 경로로 회원가입 → 로그인 → 프로젝트 생성까지 확인한다.
# (M2 완료 기준: 컨테이너로 앱 실행, probe 통과, 분리된 Frontend에서 로그인)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  smoke:
    name: Compose Up & API Flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (임시 값, 이 Job 안에서만 사용)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
          } > .env

      - name: Build & start
        run: docker compose up -d --build

      - name: Wait for backend readiness (via Nginx)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health/readiness | grep -q '"UP"'; then
              echo "ready after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready"; exit 1

      - name: Liveness probe
        run: curl -fsS http://localhost:3000/actuator/health/liveness | grep -q '"UP"'

      - name: Frontend serves index.html
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Unauthenticated request returns 401 JSON
        run: |
          status=$(curl -s -o body.json -w '%{http_code}' http://localhost:3000/api/users/me)
          cat body.json; echo
          test "$status" = "401"
          jq -e '.code == "UNAUTHORIZED"' body.json

      - name: Malformed JSON returns 400 (not 500)
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' -d '{not json')
          test "$status" = "400"

      - name: Signup → Login → Me → Create project
        run: |
          set -e
          api=http://localhost:3000/api
          curl -fsS -X POST $api/auth/signup -H 'Content-Type: application/json' \
            -d '{"email":"smoke@devflow.dev","password":"password1234","name":"스모크"}' | jq -e '.success'
          token=$(curl -fsS -X POST $api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"smoke@devflow.dev","password":"password1234"}' | jq -r '.data.accessToken')
          test -n "$token" && test "$token" != "null"
          curl -fsS $api/users/me -H "Authorization: Bearer $token" | jq -e '.data.email == "smoke@devflow.dev"'
          curl -fsS -X POST $api/projects -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Project","description":"compose smoke test"}' | jq -e '.data.id > 0'

      - name: Graceful shutdown
        run: |
          docker compose stop -t 30 backend
          docker compose logs backend | grep -E -i "graceful shutdown|Commencing graceful shutdown" || echo "(graceful 로그 없음 - 확인 필요)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
