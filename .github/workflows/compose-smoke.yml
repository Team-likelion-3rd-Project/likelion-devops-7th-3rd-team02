name: Compose Smoke Test

# 루트 docker-compose.yml로 PostgreSQL + Backend + Frontend를 실제로 띄우고
# Frontend(Nginx) → /api → Backend 경로로 회원가입 → 로그인 → 프로젝트·업무 API까지 확인한다.
# (M3: Flyway로 만든 스키마를 Hibernate validate로 검증, 업무 검색·페이지·수정 계약 확인)
# (M2 완료 기준: 컨테이너로 앱 실행, probe 통과, 분리된 Frontend에서 로그인)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  smoke:
    name: Compose Up & API Flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (임시 값, 이 Job 안에서만 사용)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "DEPLOY_WEBHOOK_TOKEN=$(openssl rand -hex 32)"
            echo "ALERTMANAGER_WEBHOOK_TOKEN=$(openssl rand -hex 32)"
            # 자동 해결을 기다리지 않도록 0초 (스케줄러 1분 주기)
            echo "INCIDENT_AUTO_RESOLVE_AFTER=0s"
          } > .env

      - name: Build & start
        run: docker compose up -d --build

      - name: Wait for backend readiness (via Nginx)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health/readiness | grep -q '"UP"'; then
              echo "ready after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready"; exit 1

      - name: Liveness probe
        run: curl -fsS http://localhost:3000/actuator/health/liveness | grep -q '"UP"'

      - name: Frontend serves index.html
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Unauthenticated request returns 401 JSON
        run: |
          status=$(curl -s -o body.json -w '%{http_code}' http://localhost:3000/api/users/me)
          cat body.json; echo
          test "$status" = "401"
          jq -e '.code == "UNAUTHORIZED"' body.json

      - name: Malformed JSON returns 400 (not 500)
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' -d '{not json')
          test "$status" = "400"

      - name: Flyway migrations applied (V1 기준선, V2 인덱스, V3 배포, V4 장애)
        run: |
          docker compose exec -T postgres psql -U devflow -d devflow -tAc \
            "select version from flyway_schema_history where success order by installed_rank" | tee versions.txt
          for v in 1 2 3 4; do grep -qx "$v" versions.txt; done

      - name: Signup → Login → Me → Create project (role)
        run: |
          set -e
          api=http://localhost:3000/api
          signup() { curl -fsS -X POST $api/auth/signup -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"password\":\"password1234\",\"name\":\"$2\"}" | jq -e '.success' > /dev/null; }
          login() { curl -fsS -X POST $api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"password\":\"password1234\"}" | jq -r '.data.accessToken'; }
          signup smoke@devflow.dev 스모크
          signup member@devflow.dev 팀원
          owner=$(login smoke@devflow.dev); member=$(login member@devflow.dev)
          test -n "$owner" && test "$owner" != "null"
          curl -fsS $api/users/me -H "Authorization: Bearer $owner" | jq -e '.data.email == "smoke@devflow.dev"'

          curl -fsS -X POST $api/projects -H "Authorization: Bearer $owner" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Project","description":"compose smoke test"}' > project.json
          jq -e '.data.id > 0 and .data.role == "OWNER"' project.json
          pid=$(jq -r '.data.id' project.json)
          curl -fsS -X POST $api/projects/$pid/members -H "Authorization: Bearer $owner" -H 'Content-Type: application/json' \
            -d '{"email":"member@devflow.dev"}' | jq -e '.success'
          curl -fsS $api/projects -H "Authorization: Bearer $member" | jq -e '.data[0].role == "MEMBER" and .data[0].updatedAt != null'
          curl -fsS $api/projects/$pid -H "Authorization: Bearer $owner" | jq -e '.data.role == "OWNER"'

          # 없는 프로젝트는 404 PROJECT_NOT_FOUND (팀원 확인보다 먼저)
          status=$(curl -s -o nf.json -w '%{http_code}' $api/projects/999999/tasks -H "Authorization: Bearer $owner")
          test "$status" = "404" && jq -e '.code == "PROJECT_NOT_FOUND"' nf.json

          member_id=$(curl -fsS $api/users/me -H "Authorization: Bearer $member" | jq -r '.data.userId')
          { echo "OWNER_TOKEN=$owner"; echo "MEMBER_TOKEN=$member"; echo "MEMBER_ID=$member_id"; echo "PROJECT_ID=$pid"; } >> "$GITHUB_ENV"

      - name: Task search · filter · page · statusCounts · PATCH
        run: |
          set -e
          api=http://localhost:3000/api/projects/$PROJECT_ID/tasks
          auth="Authorization: Bearer $OWNER_TOKEN"
          for t in "로그인 API" "로그인 화면" "배포 파이프라인"; do
            curl -fsS -X POST $api -H "$auth" -H 'Content-Type: application/json' -d "{\"title\":\"$t\"}" | jq -e '.data.issue == null and .data.pullRequest == null' > /dev/null
          done
          first=$(curl -fsS "$api?sort=createdAt,desc" -H "$auth" | jq -r '.data.tasks[-1].id')
          curl -fsS -X PATCH $api/$first/status -H "$auth" -H 'Content-Type: application/json' -d '{"status":"IN_PROGRESS"}' | jq -e '.success'

          # 상태 필터: totalCount는 status 포함, statusCounts는 status 제외 조건
          curl -fsS "$api?status=TODO" -H "$auth" | tee todo.json | jq -e \
            '.data.totalCount == 2 and (.data.tasks|length) == 2 and .data.statusCounts.TODO == 2 and .data.statusCounts.IN_PROGRESS == 1 and .data.statusCounts.DONE == 0'
          # 검색 (대소문자·부분 일치) + 페이지
          curl -fsS "$api?keyword=%EB%A1%9C%EA%B7%B8%EC%9D%B8" -H "$auth" | jq -e '.data.totalCount == 2'
          curl -fsS "$api?size=2&page=1&sort=title,asc" -H "$auth" | jq -e '.data.totalCount == 3 and (.data.tasks|length) == 1'
          # 허용되지 않는 정렬·상태는 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?sort=password,asc" -H "$auth")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?status=WRONG" -H "$auth")" = "400"

          # 업무 수정(T4): 다시 조회해도 유지, 빈 설명은 null
          curl -fsS -X PATCH $api/$first -H "$auth" -H 'Content-Type: application/json' \
            -d '{"title":"로그인 API 구현","description":""}' | jq -e '.data.title == "로그인 API 구현" and .data.description == null'
          curl -fsS $api/$first -H "$auth" | jq -e '.data.title == "로그인 API 구현"'
          # 최근 수정순 기본 정렬: 방금 수정한 업무가 맨 앞
          curl -fsS "$api" -H "$auth" | jq -e --argjson id "$first" '.data.tasks[0].id == $id'
          # 팀원이 아닌 담당자는 생성에서도 400 INVALID_TASK_ASSIGNEE
          status=$(curl -s -o bad.json -w '%{http_code}' -X POST $api -H "$auth" -H 'Content-Type: application/json' -d '{"title":"x","assigneeId":999999}')
          test "$status" = "400" && jq -e '.code == "INVALID_TASK_ASSIGNEE"' bad.json

      - name: Deployment webhook (D3) → history (D1)
        run: |
          set -e
          source .env
          hook=http://localhost:3000/api/webhooks/deployments
          body() { jq -nc --argjson pid "$PROJECT_ID" --arg svc "$1" --argjson pl "$2" --arg st "$3" \
            '{projectId:$pid, environment:"dev", service:$svc, commitSha:"7f3c2a1d9e", commitMessage:"로그인 만료 처리 추가\n\n본문",
              imageTag:"7f3c2a1", imageDigest:"sha256:abc", revision:3, status:$st, pipelineId:$pl}'; }
          # 토큰 없음·틀림 → 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Authorization: Bearer wrong' -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)")" = "401"
          auth="Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN"
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)" | jq -e '.data.status == "IN_PROGRESS"'
          # 같은 pipelineId+service → 한 행 갱신
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body backend 101 SUCCESS)" | jq -e '.data.status == "SUCCESS"'
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body frontend 102 FAILED)" | jq -e '.success'

          api=http://localhost:3000/api/projects/$PROJECT_ID/deployments
          curl -fsS "$api" -H "Authorization: Bearer $MEMBER_TOKEN" | tee dep.json | jq -e '
            .data.totalCount == 2
            and (.data.deployments | map(select(.service == "backend"))[0].status == "SUCCESS")
            and (.data.deployments[0].commitMessage == "로그인 만료 처리 추가")
            and (.data.deployments[0].deployedAt | test("\\+09:00$"))
            and (.data.collectedAt | test("\\+09:00$"))'
          curl -fsS "$api?size=1" -H "Authorization: Bearer $OWNER_TOKEN" | jq -e '.data.totalCount == 2 and (.data.deployments|length) == 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?size=0" -H "Authorization: Bearer $OWNER_TOKEN")" = "400"

      - name: Alertmanager webhook (I5) → incidents (I1~I3, I6, I7, 자동 해결)
        run: |
          set -e
          source .env
          hook=http://localhost:3000/api/webhooks/alertmanager
          hauth="Authorization: Bearer $ALERTMANAGER_WEBHOOK_TOKEN"
          alert() { # $1=status $2=fingerprint $3=severity $4=description(빈 값 가능)
            jq -nc --arg pid "$PROJECT_ID" --arg st "$1" --arg fp "$2" --arg sev "$3" --arg desc "$4" '
              {version:"4", status:$st, alerts:[{status:$st, fingerprint:$fp,
                labels:{alertname:"HighLatency", severity:$sev, devflow_project_id:$pid},
                annotations:({summary:"api 응답 시간이 기준(1.0초)을 넘고 있습니다.", current_value:"1.8", threshold:"1.0", unit:"s"}
                  + (if $desc == "" then {} else {description:$desc} end)),
                startsAt:"2026-10-15T03:48:00.000Z", endsAt:"0001-01-01T00:00:00Z"}]}'; }
          send() { curl -fsS -X POST $hook -H "$hauth" -H 'Content-Type: application/json' -d "$1"; }
          api=http://localhost:3000/api/projects/$PROJECT_ID/incidents
          me=http://localhost:3000/api/users/me/incidents
          oauth="Authorization: Bearer $OWNER_TOKEN"

          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Content-Type: application/json' -d "$(alert firing a1 warning '')")" = "401"
          # 프로젝트 라벨이 없는 알림은 건너뜀
          curl -fsS -X POST $hook -H "$hauth" -H 'Content-Type: application/json' \
            -d '{"alerts":[{"status":"firing","fingerprint":"x","labels":{"alertname":"Other"}}]}' | jq -e '.data.skipped == 1'

          # A: 새 장애 OPEN, description이 없으면 수치로 요약 생성, 발생 시각은 +09:00
          send "$(alert firing a1 warning '')" | jq -e '.data.created == 1'
          curl -fsS $api -H "$oauth" | tee inc.json | jq -e '.data as $d |
            ($d|length) == 1 and $d[0].status == "OPEN" and $d[0].severity == "WARNING" and $d[0].firing == true
            and $d[0].summary == "1.8s (기준 1.0s)" and $d[0].metric.threshold == 1.0
            and $d[0].projectName == "Smoke Project" and $d[0].occurredAt == "2026-10-15T12:48:00+09:00"' \
            || { cat inc.json; exit 1; }
          a=$(jq -r '.data[0].id' inc.json)
          # 같은 알림 반복 → 새 장애 없이 갱신
          send "$(alert firing a1 warning '')" | jq -e '.data.updated == 1 and .data.created == 0'
          curl -fsS $me -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data.openCount == 1 and (.data.incidents|length) == 1'

          # I2 확인 → 다시 확인해도 200, I3 담당자 (팀원 OK / 팀원 아님 400)
          curl -fsS -X PATCH $api/$a/ack -H "$oauth" | jq -e '.data.status == "ACKNOWLEDGED" and .data.acknowledgedAt != null'
          curl -fsS -X PATCH $api/$a/ack -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data.status == "ACKNOWLEDGED"'
          curl -fsS -X PATCH $api/$a/assignee -H "$oauth" -H 'Content-Type: application/json' -d "{\"assigneeId\":$MEMBER_ID}" \
            | jq -e --argjson m "$MEMBER_ID" '.data.assigneeId == $m'
          status=$(curl -s -o bad.json -w '%{http_code}' -X PATCH $api/$a/assignee -H "$oauth" -H 'Content-Type: application/json' -d '{"assigneeId":999999}')
          test "$status" = "400" && jq -e '.code == "INVALID_INCIDENT_ASSIGNEE"' bad.json

          # B: CRITICAL, description 그대로 요약. 울리는 중에 직접 해결(I6) → 다시 확인하면 409 → 다시 울리면 새 장애
          send "$(alert firing b1 critical 'p95 1.8초 (기준 1.0초)')" | jq -e '.data.created == 1'
          b=$(curl -fsS "$me?status=OPEN" -H "$oauth" | tee open.json | jq -r '.data.incidents[0].id')
          jq -e '.data.openCount == 1 and .data.incidents[0].summary == "p95 1.8초 (기준 1.0초)" and .data.incidents[0].severity == "CRITICAL"' open.json
          curl -fsS -X PATCH $api/$b/resolve -H "$oauth" | jq -e '.data.status == "RESOLVED" and .data.resolvedAt != null'
          status=$(curl -s -o conflict.json -w '%{http_code}' -X PATCH $api/$b/ack -H "$oauth")
          test "$status" = "409" && jq -e '.code == "INVALID_INCIDENT_STATUS"' conflict.json
          send "$(alert firing b1 critical 'p95 1.8초 (기준 1.0초)')" | jq -e '.data.created == 1'
          # I1: 해결 전 2건 + 최근 해결 1건
          curl -fsS $api -H "$oauth" | jq -e '(.data|length) == 3 and (.data | map(select(.status == "RESOLVED")) | length) == 1'
          # I7 기본(해결 전) 2건, RESOLVED 지정 1건, 쉼표 여러 값
          curl -fsS $me -H "$oauth" | jq -e '(.data.incidents|length) == 2 and .data.openCount == 1'
          curl -fsS "$me?status=RESOLVED" -H "$oauth" | jq -e '(.data.incidents|length) == 1'
          curl -fsS "$me?status=OPEN,ACKNOWLEDGED,RESOLVED" -H "$oauth" | jq -e '(.data.incidents|length) == 3'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$me?status=WRONG" -H "$oauth")" = "400"

          # A 알림 풀림 → firing=false, 확인된 장애라 자동 해결 (이 Job은 기준 0초, 스케줄러 1분 주기)
          send "$(alert resolved a1 warning '' | jq -c --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.alerts[0].endsAt = $t')" | jq -e '.data.updated == 1'
          for i in $(seq 1 18); do
            st=$(curl -fsS $api -H "$oauth" | jq -r --argjson a "$a" '.data[] | select(.id == $a) | .status')
            if [ "$st" = "RESOLVED" ]; then echo "auto-resolved after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "incident $a was not auto-resolved"; exit 1

      - name: Graceful shutdown
        run: |
          docker compose stop -t 30 backend
          docker compose logs backend | grep -E -i "graceful shutdown|Commencing graceful shutdown" || echo "(graceful 로그 없음 - 확인 필요)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
