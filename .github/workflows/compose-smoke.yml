name: Compose Smoke Test

# 루트 docker-compose.yml로 PostgreSQL + Backend + Frontend를 실제로 띄우고
# Frontend(Nginx) → /api → Backend 경로로 회원가입 → 로그인 → 프로젝트·업무 API까지 확인한다.
# (M3: Flyway로 만든 스키마를 Hibernate validate로 검증, 업무 검색·페이지·수정 계약 확인)
# (M2 완료 기준: 컨테이너로 앱 실행, probe 통과, 분리된 Frontend에서 로그인)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/smoke/**"
      - ".github/workflows/compose-smoke.yml"
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  smoke:
    name: Compose Up & API Flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 실제 compose + CI 전용 덮어쓰기(WireMock으로 Prometheus·GitHub 대신)
      COMPOSE_FILE: docker-compose.yml:.github/smoke/docker-compose.smoke.yml
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (임시 값, 이 Job 안에서만 사용)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "DEPLOY_WEBHOOK_TOKEN=$(openssl rand -hex 32)"
            echo "ALERTMANAGER_WEBHOOK_TOKEN=$(openssl rand -hex 32)"
            # 자동 해결을 기다리지 않도록 0초 (스케줄러 1분 주기)
            echo "INCIDENT_AUTO_RESOLVE_AFTER=0s"
          } > .env

      - name: Build & start
        run: docker compose up -d --build

      - name: Wait for backend readiness (via Nginx)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health/readiness | grep -q '"UP"'; then
              echo "ready after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready"; exit 1

      - name: Liveness probe
        run: curl -fsS http://localhost:3000/actuator/health/liveness | grep -q '"UP"'

      - name: Frontend serves index.html
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Unauthenticated request returns 401 JSON
        run: |
          status=$(curl -s -o body.json -w '%{http_code}' http://localhost:3000/api/users/me)
          cat body.json; echo
          test "$status" = "401"
          jq -e '.code == "UNAUTHORIZED"' body.json

      - name: Malformed JSON returns 400 (not 500)
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' -d '{not json')
          test "$status" = "400"

      - name: Flyway migrations applied (V1 기준선, V2 인덱스, V3 배포, V4 장애, V5 환경·저장소 연결, V6 소셜 로그인, V7 프로젝트 클라우드 연결, V8 첨부파일)
        run: |
          docker compose exec -T postgres psql -U devflow -d devflow -tAc \
            "select version from flyway_schema_history where success order by installed_rank" | tee versions.txt
          for v in 1 2 3 4 5 6 7 8; do grep -qx "$v" versions.txt; done

      - name: Signup → Login → Me → Create project (role)
        run: |
          set -e
          api=http://localhost:3000/api
          signup() { curl -fsS -X POST $api/auth/signup -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"password\":\"password1234\",\"name\":\"$2\"}" | jq -e '.success' > /dev/null; }
          login() { curl -fsS -X POST $api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"password\":\"password1234\"}" | jq -r '.data.accessToken'; }
          signup smoke@devflow.dev 스모크
          signup member@devflow.dev 팀원
          owner=$(login smoke@devflow.dev); member=$(login member@devflow.dev)
          test -n "$owner" && test "$owner" != "null"
          curl -fsS $api/users/me -H "Authorization: Bearer $owner" | jq -e '.data.email == "smoke@devflow.dev"'

          curl -fsS -X POST $api/projects -H "Authorization: Bearer $owner" -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Project","description":"compose smoke test"}' > project.json
          jq -e '.data.id > 0 and .data.role == "OWNER"' project.json
          pid=$(jq -r '.data.id' project.json)
          curl -fsS -X POST $api/projects/$pid/members -H "Authorization: Bearer $owner" -H 'Content-Type: application/json' \
            -d '{"email":"member@devflow.dev"}' | jq -e '.success'
          curl -fsS $api/projects -H "Authorization: Bearer $member" | jq -e '.data[0].role == "MEMBER" and .data[0].updatedAt != null'
          curl -fsS $api/projects/$pid -H "Authorization: Bearer $owner" | jq -e '.data.role == "OWNER"'

          # 없는 프로젝트는 404 PROJECT_NOT_FOUND (팀원 확인보다 먼저)
          status=$(curl -s -o nf.json -w '%{http_code}' $api/projects/999999/tasks -H "Authorization: Bearer $owner")
          test "$status" = "404" && jq -e '.code == "PROJECT_NOT_FOUND"' nf.json

          member_id=$(curl -fsS $api/users/me -H "Authorization: Bearer $member" | jq -r '.data.userId')
          # 클라우드 연결이 없는 프로젝트 (운영 화면 "연결 안 됨" 확인용)
          empty=$(curl -fsS -X POST $api/projects -H "Authorization: Bearer $owner" -H 'Content-Type: application/json' \
            -d '{"name":"Empty Project"}' | jq -r '.data.id')
          { echo "OWNER_TOKEN=$owner"; echo "MEMBER_TOKEN=$member"; echo "MEMBER_ID=$member_id"; echo "PROJECT_ID=$pid"; echo "EMPTY_PROJECT_ID=$empty"; } >> "$GITHUB_ENV"

      - name: Project cloud environments (CL1, CL2, 14장) — dev(Prometheus) · production(미연결)
        run: |
          set -e
          api=http://localhost:3000/api/projects/$PROJECT_ID/cloud/environments
          auth="Authorization: Bearer $OWNER_TOKEN"
          json='Content-Type: application/json'
          dev='{"name":"dev","label":"온프레미스 (kubeadm)","isDefault":true,
                "prometheus":{"url":"http://mock:8080/"},
                "kubernetes":{"namespace":"devflow","appDeployment":"backend","metricsJob":"backend"}}'
          # 등록 전 목록은 빈 배열 (팀원도 조회 가능)
          curl -fsS $api -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data == []'
          # 변경은 OWNER만
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api -H "Authorization: Bearer $MEMBER_TOKEN" -H "$json" -d "$dev")" = "403"
          curl -fsS -X POST $api -H "$auth" -H "$json" -d "$dev" | tee env.json | jq -e '.data
            | .name == "dev" and .isDefault == true and .prometheus == {"url":"http://mock:8080","hasToken":false}
              and .kubernetes.nodeLabel == "node" and .aws == null and (.awsTrust.externalId | startswith("devflow-"))
              and (.createdAt | test("\\+09:00$"))' || { cat env.json; exit 1; }
          curl -fsS -X POST $api -H "$auth" -H "$json" -d '{"name":"production","label":"AWS"}' | jq -e '.data.isDefault == false and .data.prometheus == null'
          # 같은 이름 409, 잘못된 이름 400
          status=$(curl -s -o e.json -w '%{http_code}' -X POST $api -H "$auth" -H "$json" -d "$dev")
          test "$status" = "409" && jq -e '.code == "DUPLICATE_ENVIRONMENT"' e.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api -H "$auth" -H "$json" -d '{"name":"Prod Env"}')" = "400"
          # SSRF 차단: 메타데이터·루프백·지원하지 않는 스킴
          for url in http://169.254.169.254/latest http://127.0.0.1:9090 http://localhost:9090 file:///etc/passwd; do
            status=$(curl -s -o e.json -w '%{http_code}' -X POST $api -H "$auth" -H "$json" \
              -d "{\"name\":\"bad\",\"prometheus\":{\"url\":\"$url\"}}")
            test "$status" = "400" && jq -e '.code == "INVALID_CLOUD_TARGET"' e.json || { echo "not blocked: $url"; cat e.json; exit 1; }
          done
          # 기본 환경이 먼저
          curl -fsS $api -H "$auth" | jq -e '[.data[].name] == ["dev","production"]'

      - name: Task search · filter · page · statusCounts · PATCH
        run: |
          set -e
          api=http://localhost:3000/api/projects/$PROJECT_ID/tasks
          auth="Authorization: Bearer $OWNER_TOKEN"
          for t in "로그인 API" "로그인 화면" "배포 파이프라인"; do
            curl -fsS -X POST $api -H "$auth" -H 'Content-Type: application/json' -d "{\"title\":\"$t\"}" | jq -e '.data.issue == null and .data.pullRequest == null' > /dev/null
          done
          first=$(curl -fsS "$api?sort=createdAt,desc" -H "$auth" | jq -r '.data.tasks[-1].id')
          curl -fsS -X PATCH $api/$first/status -H "$auth" -H 'Content-Type: application/json' -d '{"status":"IN_PROGRESS"}' | jq -e '.success'

          # 상태 필터: totalCount는 status 포함, statusCounts는 status 제외 조건
          curl -fsS "$api?status=TODO" -H "$auth" | tee todo.json | jq -e \
            '.data.totalCount == 2 and (.data.tasks|length) == 2 and .data.statusCounts.TODO == 2 and .data.statusCounts.IN_PROGRESS == 1 and .data.statusCounts.DONE == 0'
          # 검색 (대소문자·부분 일치) + 페이지
          curl -fsS "$api?keyword=%EB%A1%9C%EA%B7%B8%EC%9D%B8" -H "$auth" | jq -e '.data.totalCount == 2'
          curl -fsS "$api?size=2&page=1&sort=title,asc" -H "$auth" | jq -e '.data.totalCount == 3 and (.data.tasks|length) == 1'
          # 허용되지 않는 정렬·상태는 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?sort=password,asc" -H "$auth")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?status=WRONG" -H "$auth")" = "400"

          # 업무 수정(T4): 다시 조회해도 유지, 빈 설명은 null
          curl -fsS -X PATCH $api/$first -H "$auth" -H 'Content-Type: application/json' \
            -d '{"title":"로그인 API 구현","description":""}' | jq -e '.data.title == "로그인 API 구현" and .data.description == null'
          curl -fsS $api/$first -H "$auth" | jq -e '.data.title == "로그인 API 구현"'
          # 최근 수정순 기본 정렬: 방금 수정한 업무가 맨 앞
          curl -fsS "$api" -H "$auth" | jq -e --argjson id "$first" '.data.tasks[0].id == $id'
          # 팀원이 아닌 담당자는 생성에서도 400 INVALID_TASK_ASSIGNEE
          status=$(curl -s -o bad.json -w '%{http_code}' -X POST $api -H "$auth" -H 'Content-Type: application/json' -d '{"title":"x","assigneeId":999999}')
          test "$status" = "400" && jq -e '.code == "INVALID_TASK_ASSIGNEE"' bad.json

          # T6 담당자 지정 → assigneeId null로 해제
          curl -fsS -X PATCH $api/$first/assignee -H "$auth" -H 'Content-Type: application/json' -d "{\"assigneeId\":$MEMBER_ID}" \
            | jq -e --argjson m "$MEMBER_ID" '.data.assigneeId == $m and .data.assigneeName == "팀원"'
          curl -fsS -X PATCH $api/$first/assignee -H "$auth" -H 'Content-Type: application/json' -d '{"assigneeId":null}' \
            | jq -e '.data.assigneeId == null and .data.assigneeName == null'

          # T7 삭제: OWNER 또는 담당자만. 담당자가 아닌 팀원 403 → 담당자가 되면 200 → 다시 조회 404
          mauth="Authorization: Bearer $MEMBER_TOKEN"
          victim=$(curl -fsS -X POST $api -H "$auth" -H 'Content-Type: application/json' -d '{"title":"삭제할 업무"}' | jq -r '.data.id')
          status=$(curl -s -o e.json -w '%{http_code}' -X DELETE $api/$victim -H "$mauth")
          test "$status" = "403" && jq -e '.code == "FORBIDDEN"' e.json
          curl -fsS -X PATCH $api/$victim/assignee -H "$auth" -H 'Content-Type: application/json' -d "{\"assigneeId\":$MEMBER_ID}" | jq -e '.success'
          curl -fsS -X DELETE $api/$victim -H "$mauth" | jq -e '.success'
          status=$(curl -s -o e.json -w '%{http_code}' $api/$victim -H "$auth")
          test "$status" = "404" && jq -e '.code == "TASK_NOT_FOUND"' e.json
          # OWNER는 담당자가 아니어도 삭제 가능
          other=$(curl -fsS -X POST $api -H "$auth" -H 'Content-Type: application/json' -d '{"title":"OWNER 삭제"}' | jq -r '.data.id')
          curl -fsS -X DELETE $api/$other -H "$auth" | jq -e '.success'
          curl -fsS "$api" -H "$auth" | jq -e '.data.totalCount == 3'

      - name: Task attachments (A1~A4) — 업로드·목록·다운로드·삭제 권한·크기 제한·업무 삭제 시 정리
        run: |
          set -e
          base=http://localhost:3000
          api=$base/api/projects/$PROJECT_ID/tasks
          oauth="Authorization: Bearer $OWNER_TOKEN"; mauth="Authorization: Bearer $MEMBER_TOKEN"
          tid=$(curl -fsS -X POST $api -H "$oauth" -H 'Content-Type: application/json' -d '{"title":"첨부 테스트"}' | jq -r '.data.id')
          att=$api/$tid/attachments
          printf '회의 메모 본문' > memo.txt

          # 인증 없음 401, 빈 파일 400
          test "$(curl -s -o /dev/null -w '%{http_code}' $att)" = "401"
          : > empty.txt
          status=$(curl -s -o e.json -w '%{http_code}' -X POST $att -H "$mauth" -F "file=@empty.txt")
          test "$status" = "400" && jq -e '.code == "INVALID_REQUEST"' e.json

          # A2 팀원 업로드 (한글 파일 이름) → 201
          curl -fsS -X POST $att -H "$mauth" -F "file=@memo.txt;type=text/plain;filename=회의 메모.txt" | tee up.json \
            | jq -e --argjson n "$(wc -c < memo.txt)" '.data | .fileName == "회의 메모.txt" and .contentType == "text/plain" and .size == $n and .uploaderName == "팀원" and (.createdAt | test("\\+09:00$"))'
          a1=$(jq -r '.data.id' up.json)
          # OWNER 업로드
          a2=$(curl -fsS -X POST $att -H "$oauth" -F "file=@memo.txt;filename=owner.txt" | jq -r '.data.id')

          # A1 목록
          curl -fsS $att -H "$oauth" | jq -e '(.data | length) == 2 and .data[0].id == '"$a1"

          # A3 다운로드 주소 → 인증 없이 열림, 내용·파일 이름 일치
          curl -fsS $att/$a1/download -H "$mauth" | tee dl.json | jq -e '(.data.url | startswith("/api/attachments/files/")) and .data.expiresAt != null'
          url=$(jq -r '.data.url' dl.json)
          curl -fsS -D dl.h -o got.txt "$base$url"
          cmp memo.txt got.txt
          grep -qi "content-disposition: attachment" dl.h
          grep -qi "filename\*=UTF-8''" dl.h
          # 위조 토큰 404
          status=$(curl -s -o e.json -w '%{http_code}' "$base${url}x")
          test "$status" = "404" && jq -e '.code == "ATTACHMENT_NOT_FOUND"' e.json

          # A4 삭제: 팀원은 남의 파일 403, 자기 파일 200
          status=$(curl -s -o e.json -w '%{http_code}' -X DELETE $att/$a2 -H "$mauth")
          test "$status" = "403" && jq -e '.code == "FORBIDDEN"' e.json
          curl -fsS -X DELETE $att/$a1 -H "$mauth" | jq -e '.success'
          test "$(curl -s -o /dev/null -w '%{http_code}' $att/$a1/download -H "$oauth")" = "404"

          # 크기 제한 (10MB 초과) → 413 JSON
          head -c 11000000 /dev/urandom > big.bin
          status=$(curl -s -o e.json -w '%{http_code}' -X POST $att -H "$oauth" -F "file=@big.bin")
          test "$status" = "413" && jq -e '.code == "ATTACHMENT_TOO_LARGE"' e.json || { cat e.json; exit 1; }

          # 업무 삭제(T7) → 첨부 메타데이터와 파일 모두 정리
          curl -fsS -X DELETE $api/$tid -H "$oauth" | jq -e '.success'
          test "$(curl -s -o /dev/null -w '%{http_code}' $att -H "$oauth")" = "404"
          left=$(docker compose exec -T backend sh -c "find /tmp/devflow-attachments/projects/$PROJECT_ID/tasks/$tid -type f 2>/dev/null | wc -l")
          test "$(echo $left | tr -d '[:space:]')" = "0"

      - name: Deployment webhook (D3) → history (D1)
        run: |
          set -e
          source .env
          hook=http://localhost:3000/api/webhooks/deployments
          body() { jq -nc --argjson pid "$PROJECT_ID" --arg svc "$1" --argjson pl "$2" --arg st "$3" \
            '{projectId:$pid, environment:"dev", service:$svc, commitSha:"7f3c2a1d9e", commitMessage:"로그인 만료 처리 추가\n\n본문",
              imageTag:"7f3c2a1", imageDigest:"sha256:abc", revision:3, status:$st, pipelineId:$pl}'; }
          # 토큰 없음·틀림 → 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Authorization: Bearer wrong' -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)")" = "401"
          auth="Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN"
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body backend 101 IN_PROGRESS)" | jq -e '.data.status == "IN_PROGRESS"'
          # 같은 pipelineId+service → 한 행 갱신
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body backend 101 SUCCESS)" | jq -e '.data.status == "SUCCESS"'
          curl -fsS -X POST $hook -H "$auth" -H 'Content-Type: application/json' -d "$(body frontend 102 FAILED)" | jq -e '.success'

          api=http://localhost:3000/api/projects/$PROJECT_ID/deployments
          curl -fsS "$api" -H "Authorization: Bearer $MEMBER_TOKEN" | tee dep.json | jq -e '
            .data.totalCount == 2
            and (.data.deployments | map(select(.service == "backend"))[0].status == "SUCCESS")
            and (.data.deployments[0].commitMessage == "로그인 만료 처리 추가")
            and (.data.deployments[0].deployedAt | test("\\+09:00$"))
            and (.data.collectedAt | test("\\+09:00$"))'
          curl -fsS "$api?size=1" -H "Authorization: Bearer $OWNER_TOKEN" | jq -e '.data.totalCount == 2 and (.data.deployments|length) == 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api?size=0" -H "Authorization: Bearer $OWNER_TOKEN")" = "400"

      - name: Alertmanager webhook (I5) → incidents (I1~I3, I6, I7, 자동 해결)
        run: |
          set -e
          source .env
          hook=http://localhost:3000/api/webhooks/alertmanager
          hauth="Authorization: Bearer $ALERTMANAGER_WEBHOOK_TOKEN"
          alert() { # $1=status $2=fingerprint $3=severity $4=description(빈 값 가능)
            jq -nc --arg pid "$PROJECT_ID" --arg st "$1" --arg fp "$2" --arg sev "$3" --arg desc "$4" '
              {version:"4", status:$st, alerts:[{status:$st, fingerprint:$fp,
                labels:{alertname:"HighLatency", severity:$sev, devflow_project_id:$pid},
                annotations:({summary:"api 응답 시간이 기준(1.0초)을 넘고 있습니다.", current_value:"1.8", threshold:"1.0", unit:"s"}
                  + (if $desc == "" then {} else {description:$desc} end)),
                startsAt:"2026-10-15T03:48:00.000Z", endsAt:"0001-01-01T00:00:00Z"}]}'; }
          send() { curl -fsS -X POST $hook -H "$hauth" -H 'Content-Type: application/json' -d "$1"; }
          api=http://localhost:3000/api/projects/$PROJECT_ID/incidents
          me=http://localhost:3000/api/users/me/incidents
          oauth="Authorization: Bearer $OWNER_TOKEN"

          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H 'Content-Type: application/json' -d "$(alert firing a1 warning '')")" = "401"
          # 프로젝트 라벨이 없는 알림은 건너뜀
          curl -fsS -X POST $hook -H "$hauth" -H 'Content-Type: application/json' \
            -d '{"alerts":[{"status":"firing","fingerprint":"x","labels":{"alertname":"Other"}}]}' | jq -e '.data.skipped == 1'

          # A: 새 장애 OPEN, description이 없으면 수치로 요약 생성, 발생 시각은 +09:00
          send "$(alert firing a1 warning '')" | jq -e '.data.created == 1'
          curl -fsS $api -H "$oauth" | tee inc.json | jq -e '.data as $d |
            ($d|length) == 1 and $d[0].status == "OPEN" and $d[0].severity == "WARNING" and $d[0].firing == true
            and $d[0].summary == "1.8s (기준 1.0s)" and $d[0].metric.threshold == 1.0
            and $d[0].projectName == "Smoke Project" and $d[0].occurredAt == "2026-10-15T12:48:00+09:00"' \
            || { cat inc.json; exit 1; }
          a=$(jq -r '.data[0].id' inc.json)
          # 같은 알림 반복 → 새 장애 없이 갱신
          send "$(alert firing a1 warning '')" | jq -e '.data.updated == 1 and .data.created == 0'
          curl -fsS $me -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data.openCount == 1 and (.data.incidents|length) == 1'

          # I2 확인 → 다시 확인해도 200, I3 담당자 (팀원 OK / 팀원 아님 400)
          curl -fsS -X PATCH $api/$a/ack -H "$oauth" | jq -e '.data.status == "ACKNOWLEDGED" and .data.acknowledgedAt != null'
          curl -fsS -X PATCH $api/$a/ack -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data.status == "ACKNOWLEDGED"'
          curl -fsS -X PATCH $api/$a/assignee -H "$oauth" -H 'Content-Type: application/json' -d "{\"assigneeId\":$MEMBER_ID}" \
            | jq -e --argjson m "$MEMBER_ID" '.data.assigneeId == $m'
          status=$(curl -s -o bad.json -w '%{http_code}' -X PATCH $api/$a/assignee -H "$oauth" -H 'Content-Type: application/json' -d '{"assigneeId":999999}')
          test "$status" = "400" && jq -e '.code == "INVALID_INCIDENT_ASSIGNEE"' bad.json

          # B: CRITICAL, description 그대로 요약. 울리는 중에 직접 해결(I6) → 다시 확인하면 409 → 다시 울리면 새 장애
          send "$(alert firing b1 critical 'p95 1.8초 (기준 1.0초)')" | jq -e '.data.created == 1'
          b=$(curl -fsS "$me?status=OPEN" -H "$oauth" | tee open.json | jq -r '.data.incidents[0].id')
          jq -e '.data.openCount == 1 and .data.incidents[0].summary == "p95 1.8초 (기준 1.0초)" and .data.incidents[0].severity == "CRITICAL"' open.json
          curl -fsS -X PATCH $api/$b/resolve -H "$oauth" | jq -e '.data.status == "RESOLVED" and .data.resolvedAt != null'
          status=$(curl -s -o conflict.json -w '%{http_code}' -X PATCH $api/$b/ack -H "$oauth")
          test "$status" = "409" && jq -e '.code == "INVALID_INCIDENT_STATUS"' conflict.json
          send "$(alert firing b1 critical 'p95 1.8초 (기준 1.0초)')" | jq -e '.data.created == 1'
          # I1: 해결 전 2건 + 최근 해결 1건
          curl -fsS $api -H "$oauth" | jq -e '(.data|length) == 3 and (.data | map(select(.status == "RESOLVED")) | length) == 1'
          # I7 기본(해결 전) 2건, RESOLVED 지정 1건, 쉼표 여러 값
          curl -fsS $me -H "$oauth" | jq -e '(.data.incidents|length) == 2 and .data.openCount == 1'
          curl -fsS "$me?status=RESOLVED" -H "$oauth" | jq -e '(.data.incidents|length) == 1'
          curl -fsS "$me?status=OPEN,ACKNOWLEDGED,RESOLVED" -H "$oauth" | jq -e '(.data.incidents|length) == 3'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$me?status=WRONG" -H "$oauth")" = "400"

          # A 알림 풀림 → firing=false, 확인된 장애라 자동 해결 (이 Job은 기준 0초, 스케줄러 1분 주기)
          send "$(alert resolved a1 warning '' | jq -c --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.alerts[0].endsAt = $t')" | jq -e '.data.updated == 1'
          for i in $(seq 1 18); do
            st=$(curl -fsS $api -H "$oauth" | jq -r --argjson a "$a" '.data[] | select(.id == $a) | .status')
            if [ "$st" = "RESOLVED" ]; then echo "auto-resolved after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "incident $a was not auto-resolved"; exit 1

      - name: Ops status via Prometheus (K1, K2, E1~E3, O1, D1 health)
        run: |
          set -e
          api=http://localhost:3000/api/projects/$PROJECT_ID
          auth="Authorization: Bearer $OWNER_TOKEN"
          check() { # $1=경로 $2=jq 조건
            curl -fsS "$api$1" -H "$auth" > out.json || { cat out.json; exit 1; }
            jq -e "$2" out.json > /dev/null || { echo "FAILED: $1"; cat out.json; exit 1; }
          }
          check /k8s/deployments '.data.deployments | map(select(.name == "backend"))[0] | .desiredReplicas == 2 and .readyReplicas == 2 and .updatedReplicas == 2'
          check /k8s/pods '.data.pods as $p | ($p|length) == 2
            and ($p[] | select(.name == "backend-7d9f-x2k8p") | .status == "Running" and .restartCount == 3 and .image == "backend:7f3c2a1" and .readyContainers == 1 and .totalContainers == 1)
            and ($p[] | select(.name == "backend-7d9f-crash1") | .status == "CrashLoopBackOff" and .image == "backend:7f3c2a1")'
          check /k8s/nodes '.data.nodes as $n | ($n|length) == 2
            and ($n[0].name == "k8s-master" and $n[0].roles == ["control-plane"] and $n[0].ready == true and $n[0].cpuUsage == 38.5)
            and ($n[1].roles == ["worker"] and $n[1].memoryUsage == 72.4 and $n[1].kubeletVersion == "v1.31.2")
            and (.data.collectedAt | test("\\+09:00$"))'
          check "/k8s/hpa?env=dev" '.data.hpas[0] | .name == "backend-hpa" and .target == "backend" and .currentReplicas == 3 and .desiredReplicas == 4
            and .minReplicas == 2 and .maxReplicas == 6 and .currentCpuUtilization == 72 and .targetCpuUtilization == 60'
          check "/monitoring/summary?range=6h" '.data | .httpRequestCount == 18420 and .errorRate == 0.6 and .avgResponseTimeMs == 1500
            and .cpuUsage == 55.0 and .memoryUsage == 74.0 and .replicas == {"ready":2,"desired":2} and (.series|length) == 12'
          # E1: dev(기본 환경)는 수집 성공(열린 CRITICAL 장애 → DOWN), production은 배포 기록 없음
          check /environments '(.data|length) == 2
            and (.data[0] | .name == "dev" and .reason == null and .health == "DOWN" and .replicas.ready == 2
                 and .currentImageTag == "7f3c2a1" and .openIncidents == 1 and .collectedAt != null)
            and (.data[1] | .name == "production" and .health == "UNKNOWN" and .reason == "NOT_DEPLOYED" and .replicas == null)'
          # D1: 최근 배포(frontend)의 health는 frontend Deployment 레플리카로 판정
          check "/deployments?size=3" '.data.deployments[0].health == "HEALTHY" and .data.deployments[1].health == null'
          # E4·E5: 온프렘은 Prometheus(postgres_exporter, 백업 CronJob, Traefik)
          check /cloud/database '.data | .source == "PROMETHEUS" and .status == "AVAILABLE" and .connections == 8
            and .storageUsedGb == 0.05 and .lastBackupAt == "2026-10-16T09:00:00+09:00" and .cpuUsage == null'
          check /cloud/load-balancer '.data | .source == "PROMETHEUS" and .healthyTargets == 4 and .unhealthyTargets == 0
            and .requestCount == 1200 and .http5xxCount == 3 and .avgResponseTimeMs == 120'
          # 잘못된 range 400, 없는 env 404, Prometheus·AWS가 연결되지 않은 env 404 CLOUD_NOT_CONNECTED
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/monitoring/summary?range=2h" -H "$auth")" = "400"
          test "$(curl -s -o e.json -w '%{http_code}' "$api/k8s/pods?env=prod" -H "$auth")" = "404" && jq -e '.code == "ENVIRONMENT_NOT_FOUND"' e.json
          for path in "/k8s/nodes?env=production" "/cloud/database?env=production" "/monitoring/summary?env=production"; do
            status=$(curl -s -o e.json -w '%{http_code}' "$api$path" -H "$auth")
            test "$status" = "404" && jq -e '.code == "CLOUD_NOT_CONNECTED"' e.json || { echo "FAILED: $path"; cat e.json; exit 1; }
          done
          # 다른 프로젝트에는 이 프로젝트의 클러스터 상태가 보이지 않는다 (연결 전: E1 빈 목록, 나머지 404)
          empty=http://localhost:3000/api/projects/$EMPTY_PROJECT_ID
          curl -fsS $empty/environments -H "$auth" | jq -e '.data == []'
          for path in /k8s/pods /k8s/nodes /cloud/database /monitoring/summary; do
            status=$(curl -s -o e.json -w '%{http_code}' "$empty$path" -H "$auth")
            test "$status" = "404" && jq -e '.code == "CLOUD_NOT_CONNECTED"' e.json || { echo "FAILED: empty $path"; cat e.json; exit 1; }
          done
          # 팀원이 아닌 프로젝트는 403
          test "$(curl -s -o /dev/null -w '%{http_code}' $empty/k8s/pods -H "Authorization: Bearer $MEMBER_TOKEN")" = "403"

      - name: GitHub repository (G1, G2) → pipelines (C1)
        run: |
          set -e
          api=http://localhost:3000/api/projects/$PROJECT_ID
          auth="Authorization: Bearer $OWNER_TOKEN"
          json='Content-Type: application/json'
          # 연결 전: 저장소 null, 파이프라인 빈 목록, GitLab 항상 null
          curl -fsS $api/github/repository -H "$auth" | jq -e '.data == null'
          curl -fsS $api/cicd/pipelines -H "$auth" | jq -e '.data.totalCount == 0 and .data.pipelines == []'
          curl -fsS $api/integrations/gitlab -H "$auth" | jq -e '.success and .data == null'
          # 연결은 OWNER만, 주소 형식·접근 확인
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $api/integrations/github -H "Authorization: Bearer $MEMBER_TOKEN" -H "$json" -d '{"repositoryUrl":"https://github.com/team02/devflow"}')" = "403"
          test "$(curl -s -o e.json -w '%{http_code}' -X POST $api/integrations/github -H "$auth" -H "$json" -d '{"repositoryUrl":"https://gitlab.com/team02/devflow"}')" = "400" && jq -e '.code == "INVALID_REPOSITORY_URL"' e.json
          test "$(curl -s -o e.json -w '%{http_code}' -X POST $api/integrations/github -H "$auth" -H "$json" -d '{"repositoryUrl":"https://github.com/team02/missing"}')" = "400" && jq -e '.code == "REPOSITORY_NOT_ACCESSIBLE"' e.json
          curl -fsS -X POST $api/integrations/github -H "$auth" -H "$json" -d '{"repositoryUrl":"https://github.com/team02/devflow.git/"}' \
            | jq -e '.data == {"fullName":"team02/devflow","url":"https://github.com/team02/devflow"}'
          curl -fsS $api/github/repository -H "Authorization: Bearer $MEMBER_TOKEN" | jq -e '.data.fullName == "team02/devflow"'

          curl -fsS "$api/cicd/pipelines?size=10" -H "$auth" > p.json || { cat p.json; exit 1; }
          jq -e '.data.totalCount == 2 and (.data.pipelines|length) == 2
            and (.data.pipelines[0] | .number == 318 and .status == "RUNNING" and .finishedAt == null and .commitMessage == "작업 검색과 필터 추가"
                 and .startedAt == "2026-10-15T12:54:00+09:00" and ([.stages[].name] == ["BUILD","TEST","IMAGE","VERIFY","DEPLOY"])
                 and ([.stages[].status] == ["SUCCESS","SUCCESS","SUCCESS","PENDING","RUNNING"]))
            and (.data.pipelines[1] | .status == "FAILED" and .finishedAt != null and (.stages[] | select(.name == "TEST") | .status == "FAILED"))' p.json \
            || { cat p.json; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/cicd/pipelines?size=31" -H "$auth")" = "400"

      - name: Cloud settings (CL3~CL5) · project webhook tokens (WT1, WT2 → D3, I5)
        run: |
          set -e
          source .env
          base=http://localhost:3000/api/projects/$PROJECT_ID
          auth="Authorization: Bearer $OWNER_TOKEN"
          json='Content-Type: application/json'
          envs=$base/cloud/environments
          dev_id=$(curl -fsS $envs -H "$auth" | jq -r '.data[] | select(.name == "dev") | .id')
          prod_id=$(curl -fsS $envs -H "$auth" | jq -r '.data[] | select(.name == "production") | .id')

          # CL5 연결 확인: Prometheus OK, AWS 미설정
          curl -fsS -X POST $envs/$dev_id/test -H "$auth" | tee t.json | jq -e '.data.prometheus.status == "OK" and .data.aws.status == "NOT_CONFIGURED"' \
            || { cat t.json; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $envs/$dev_id/test -H "Authorization: Bearer $MEMBER_TOKEN")" = "403"
          # CL3: 토큰 입력 → hasToken true, 토큰 생략 → 유지, "" → 삭제. 기본 환경 변경
          upd() { curl -fsS -X PUT $envs/$dev_id -H "$auth" -H "$json" -d "$1"; }
          upd '{"name":"dev","prometheus":{"url":"http://mock:8080","token":"smoke-prom-token"},"kubernetes":{"namespace":"devflow","appDeployment":"backend"}}' | jq -e '.data.prometheus.hasToken == true'
          upd '{"name":"dev","prometheus":{"url":"http://mock:8080"},"kubernetes":{"namespace":"devflow","appDeployment":"backend"}}' | jq -e '.data.prometheus.hasToken == true'
          upd '{"name":"dev","prometheus":{"url":"http://mock:8080","token":""},"kubernetes":{"namespace":"devflow","appDeployment":"backend"}}' | jq -e '.data.prometheus.hasToken == false'
          curl -fsS -X PUT $envs/$prod_id -H "$auth" -H "$json" -d '{"name":"production","label":"AWS","isDefault":true}' | jq -e '.data.isDefault == true'
          curl -fsS $envs -H "$auth" | jq -e '[.data[].name] == ["production","dev"]'
          # 기본 환경 production은 미연결 → env 생략 시 404
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/k8s/pods -H "$auth")" = "404"
          # CL4: 기본 환경 삭제 → 남은 dev가 기본
          curl -fsS -X DELETE $envs/$prod_id -H "$auth" | jq -e '.success'
          curl -fsS $envs -H "$auth" | jq -e '(.data|length) == 1 and .data[0].name == "dev" and .data[0].isDefault == true'
          curl -fsS $base/k8s/pods -H "$auth" | jq -e '(.data.pods|length) == 2'

          # WT2 배포 토큰 발급 (OWNER만, 원문은 한 번만)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/webhook-tokens/deployment -H "Authorization: Bearer $MEMBER_TOKEN")" = "403"
          dtoken=$(curl -fsS -X POST $base/webhook-tokens/deployment -H "$auth" | tee tk.json | jq -r '.data.token')
          jq -e '.data.type == "deployment" and (.data.token | startswith("dfw_"))' tk.json
          hook=http://localhost:3000/api/webhooks/deployments
          body='{"environment":"dev","service":"backend","commitSha":"9a8b7c6","imageTag":"9a8b7c6","status":"SUCCESS","pipelineId":201}'
          # 프로젝트 토큰이면 projectId 생략 가능
          curl -fsS -X POST $hook -H "Authorization: Bearer $dtoken" -H "$json" -d "$body" | jq -e '.data.imageTag == "9a8b7c6"'
          # 토큰의 프로젝트와 다른 projectId → 403
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H "Authorization: Bearer $dtoken" -H "$json" \
            -d "$(echo "$body" | jq -c --argjson p "$EMPTY_PROJECT_ID" '.projectId = $p')")
          test "$status" = "403"
          # 서버 공용 토큰은 projectId 필수 (400)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" -H "$json" -d "$body")" = "400"
          # 다른 종류(Alertmanager) 엔드포인트에는 쓸 수 없음
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/webhooks/alertmanager -H "Authorization: Bearer $dtoken" -H "$json" -d '{"alerts":[]}')" = "401"
          # WT1 목록에 사용 시각, 원문은 없음
          curl -fsS $base/webhook-tokens -H "$auth" | jq -e '(.data|length) == 1 and .data[0].type == "deployment" and .data[0].lastUsedAt != null and (.data[0]|has("token")|not)'
          # 재발급 → 이전 토큰 즉시 401
          curl -fsS -X POST $base/webhook-tokens/deployment -H "$auth" | jq -e '.data.token != null'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $hook -H "Authorization: Bearer $dtoken" -H "$json" -d "$body")" = "401"

          # Alertmanager 프로젝트 토큰: 라벨 없이 이 프로젝트로 기록, 다른 프로젝트 라벨은 건너뜀
          atoken=$(curl -fsS -X POST $base/webhook-tokens/alertmanager -H "$auth" | jq -r '.data.token')
          alerts=$(jq -nc --arg other "$EMPTY_PROJECT_ID" '{alerts:[
            {status:"firing", fingerprint:"wt1", labels:{alertname:"PodRestart", severity:"warning"},
             annotations:{summary:"backend Pod 재시작"}, startsAt:"2026-10-17T01:00:00Z"},
            {status:"firing", fingerprint:"wt2", labels:{alertname:"Other", devflow_project_id:$other}}]}')
          curl -fsS -X POST http://localhost:3000/api/webhooks/alertmanager -H "Authorization: Bearer $atoken" -H "$json" -d "$alerts" \
            | jq -e '.data.created == 1 and .data.skipped == 1'
          curl -fsS $base/incidents -H "$auth" | jq -e '.data | map(select(.title == "backend Pod 재시작")) | length == 1'
          curl -fsS http://localhost:3000/api/projects/$EMPTY_PROJECT_ID/incidents -H "$auth" | jq -e '.data == []'

      - name: Social login (X1~X3) with GitHub OAuth mock
        run: |
          set -eE
          base=http://localhost:3000
          loc() { grep -i '^location:' "$1" | tr -d '\r' | cut -d' ' -f2-; }
          # 실패하면 마지막 응답 헤더·본문을 출력
          trap 'echo "--- start.h"; cat start.h 2>/dev/null; echo "--- cb.h"; cat cb.h 2>/dev/null; echo "--- ex.json"; cat ex.json 2>/dev/null' ERR
          param() { python3 -c 'import sys,urllib.parse as u; q=u.parse_qs(u.urlsplit(sys.argv[1]).query); print(q.get(sys.argv[2],[""])[0])' "$1" "$2"; }
          start() { # 로그인 시작 → 제공자 인증 주소로 302, 서명 쿠키 발급
            rm -f jar.txt
            curl -s -o /dev/null -D start.h -c jar.txt "$base/oauth2/authorization/github"
            auth=$(loc start.h)
            case "$auth" in http://localhost:8089/login/oauth/authorize\?*) ;; *) echo "unexpected authorize url: $auth"; false ;; esac
            test "$(param "$auth" redirect_uri)" = "http://localhost:3000/login/oauth2/code/github"
            test "$(param "$auth" client_id)" = "smoke-client"
            state=$(param "$auth" state)
            test -n "$state"
            grep -qi '^set-cookie: devflow_oauth2_request=' start.h
          }
          enc() { python3 -c 'import sys,urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$1"; }
          callback() { # 제공자가 돌려보낸 것처럼 콜백 호출 → Frontend /oauth/callback 으로 302
            curl -s -o /dev/null -D cb.h -b jar.txt "$base/login/oauth2/code/github?$1"
            loc cb.h
          }
          exchange() { curl -s -o ex.json -w '%{http_code}' -X POST $base/api/auth/oauth/token -H 'Content-Type: application/json' -d "{\"code\":\"$1\"}"; }

          # 1) 새 사용자: 인증된 primary 이메일로 가입 → 1회용 code → JWT
          start
          to=$(callback "code=octo&state=$(enc "$state")"); echo "$to"
          echo "$to" | grep -q '^http://localhost:3000/oauth/callback?code='
          one=${to#*code=}
          test "$(exchange "$one")" = "200"
          jwt=$(jq -r '.data.accessToken' ex.json); jq -e '.data.tokenType == "Bearer"' ex.json
          curl -fsS $base/api/users/me -H "Authorization: Bearer $jwt" | jq -e '.data.email == "octo@devflow.dev" and .data.name == "Octo Smoke"'
          # 같은 code 재사용 → 400 INVALID_OAUTH_CODE
          test "$(exchange "$one")" = "400" && jq -e '.code == "INVALID_OAUTH_CODE"' ex.json
          # 소셜 전용 사용자는 이메일 로그인 불가
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/api/auth/login -H 'Content-Type: application/json' -d '{"email":"octo@devflow.dev","password":"password1234"}')" = "401"
          # 다시 로그인하면 같은 사용자
          start; to=$(callback "code=octo&state=$(enc "$state")"); test "$(exchange "${to#*code=}")" = "200"
          curl -fsS $base/api/users/me -H "Authorization: Bearer $(jq -r '.data.accessToken' ex.json)" | jq -e '.data.email == "octo@devflow.dev"'

          # 2) 같은 이메일(smoke@devflow.dev) 기존 계정에 자동 연결 → 기존 프로젝트가 보임
          start; to=$(callback "code=link&state=$(enc "$state")"); test "$(exchange "${to#*code=}")" = "200"
          curl -fsS $base/api/projects -H "Authorization: Bearer $(jq -r '.data.accessToken' ex.json)" | jq -e 'any(.data[]; .name == "Smoke Project" and .role == "OWNER")'

          # 3) 이미 다른 GitHub 계정이 연결된 이메일 → account_conflict
          start; test "$(callback "code=conflict&state=$(enc "$state")")" = "http://localhost:3000/oauth/callback?error=account_conflict"
          # 4) 인증된 이메일 없음 → email_not_available
          start; test "$(callback "code=unverified&state=$(enc "$state")")" = "http://localhost:3000/oauth/callback?error=email_not_available"
          # 5) 제공자 화면에서 취소 → access_denied
          start; test "$(callback "error=access_denied&state=$(enc "$state")")" = "http://localhost:3000/oauth/callback?error=access_denied"
          # 6) state 불일치(CSRF) → oauth_failed
          start; test "$(callback "code=octo&state=forged")" = "http://localhost:3000/oauth/callback?error=oauth_failed"
          # 7) 설정되지 않은 제공자(Google) → oauth_failed
          curl -s -o /dev/null -D g.h "$base/oauth2/authorization/google"
          test "$(loc g.h)" = "http://localhost:3000/oauth/callback?error=oauth_failed"

      - name: k6 smoke (부하 테스트 스크립트 동작 확인)
        run: |
          docker run --rm -i --network host -v "$PWD/scripts/k6:/s" grafana/k6:0.54.0 \
            run -e BASE_URL=http://localhost:3000 -e PROFILE=smoke /s/devflow-load.js

      - name: Graceful shutdown
        run: |
          docker compose stop -t 30 backend
          docker compose logs backend | grep -E -i "graceful shutdown|Commencing graceful shutdown" || echo "(graceful 로그 없음 - 확인 필요)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
