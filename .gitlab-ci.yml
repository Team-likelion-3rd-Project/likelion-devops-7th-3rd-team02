stages:
  - build
  - test
  - image
  - verify
  - deploy

frontend-build:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

backend-test:
  stage: test
  image: gradle:8.14-jdk21
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew test --no-daemon

backend-build:
  stage: build
  image: gradle:8.14-jdk21
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew clean bootJar -x test --no-daemon
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 day

frontend-image:
  stage: image
  image: docker:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

backend-image:
  stage: image
  image: docker:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
aws-eks-check:
  stage: verify
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws --version
    - aws sts get-caller-identity
    - aws eks describe-cluster --region ap-northeast-1 --name devflow-dev-eks
eks-kubectl-check:
  stage: verify
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
  script:
    - aws sts get-caller-identity
    - aws eks update-kubeconfig --region ap-northeast-1 --name devflow-dev-eks
    - kubectl get namespaces
# DEPRECATED (Phase 3.1): kubectl direct deploy path. Keep for transition
# rollback only; remove after GitOps cutover verification (Plan §6 steps 13-15).
deploy-dev:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
  script:
    - ./scripts/deploy.sh
  when: manual
  only:
    - feature/devops
    - develop
health-check-dev:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-1 --name devflow-dev-eks
  script:
    - ./scripts/health-check.sh
  needs:
    - deploy-dev
  when: on_success
  only:
    - feature/devops
    - develop

# DEPRECATED (Phase 3.1): kubectl rollout undo path. Git-only rollback is
# rollback-gitops-dev below. Remove after GitOps cutover verification.
rollback-dev:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-1 --name devflow-dev-eks
  script:
    - ./scripts/rollback.sh
  when: manual
  allow_failure: true
  only:
    - feature/devops
    - develop

# ---- Phase 3.1 GitOps path — replaces the kubectl jobs above after cutover ----
# GITOPS_TOKEN: masked CI/CD variable (project access token, write_repository
# scope on the GitOps repository). Creating/registering it is a user action.
deploy-gitops-dev:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GITOPS_REPO_URL: "https://team02-gitlab.manoit.co.kr/root/devflow-gitops.git"
    GITOPS_BRANCH: "main"
  script:
    - sh ./scripts/update-gitops-release.sh
  needs:
    - frontend-image
    - backend-image
  when: manual
  only:
    - feature/devops
    - develop

verify-gitops-dev:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - curl -LO "https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-1 --name devflow-dev-eks
  script:
    - sh ./scripts/verify-gitops-dev.sh
  when: manual
  only:
    - feature/devops
    - develop

rollback-gitops-dev:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GITOPS_REPO_URL: "https://team02-gitlab.manoit.co.kr/root/devflow-gitops.git"
    GITOPS_BRANCH: "main"
    GITOPS_RELEASE_COMMIT: ""  # release commit to revert; empty = HEAD (latest release)
  script:
    - sh ./scripts/rollback-gitops-release.sh
  when: manual
  allow_failure: true
  only:
    - feature/devops
    - develop

# ---- Phase 3.2: Frontend static deploy (S3 + CloudFront) ----
# Path: frontend-build (dist/ artifacts) -> s3 sync -> cloudfront invalidation.
# FRONTEND_S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID are CI/CD variables holding
# terraform outputs (terraform/environments/dev/outputs.tf). AWS auth is the
# runner EC2 instance role (gitlab-frontend-deploy policy) - no keys here.
# frontend-image and deploy-gitops-dev above stay until the Phase 3.2 cutover
# is verified (docs/migration/phase-3.2-cutover-runbook.md step 13).
frontend-deploy-dev:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  variables:
    AWS_DEFAULT_REGION: "ap-northeast-1"
  needs:
    - frontend-build
  script:
    - sh ./scripts/deploy-frontend-s3.sh
  when: manual
  only:
    - feature/devops
    - develop      
